env:
  action_frequency: 30
  physics_frequency: 120
  device: null
  initial_pos_z_offset: 0.1
  automatic_reset: false
  flatten_action_space: false
  flatten_obs_space: false
  use_external_obs: false
  external_sensors: null

render:
  viewer_width: 1280
  viewer_height: 720

scene:
  type: InteractiveTraversableScene
  scene_model: Rs_int
  trav_map_resolution: 0.1
  default_erosion_radius: 0.0
  trav_map_with_objects: true
  num_waypoints: 1
  waypoint_resolution: 0.2
  load_object_categories: null
  not_load_object_categories: [
    "ceilings", "carpet", "picture", "electric_switch", "openable_window",
    "bookcase", "sofa", "ottoman", "straight_chair", "swivel_chair",
    "floor_lamp", "laptop", "loudspeaker", "pot_plant", "standing_tv",
    "table_lamp"
  ]
  load_room_types: null
  load_room_instances: null
  load_task_relevant_only: false
  seg_map_resolution: 1.0
  scene_source: OG
  include_robots: false

robots:
  - type: Fetch
    obs_modalities: [rgb]
    include_sensor_names: null
    exclude_sensor_names: null
    scale: 1.0
    self_collisions: true
    action_normalize: false
    action_type: continuous
    grasping_mode: sticky
    default_reset_mode: untuck
    sensor_config:
      VisionSensor:
        sensor_kwargs:
          image_height: 256
          image_width: 256
    controller_config:
      base:
        name: DifferentialDriveController
      trunk:
        name: JointController
        motor_type: position
        command_input_limits: null
        use_delta_commands: false
        use_impedances: false
      camera:
        name: JointController
        motor_type: position
        command_input_limits: null
        use_delta_commands: false
        use_impedances: false
      arm_right:
        name: JointController
        motor_type: position
        command_input_limits: null
        use_delta_commands: false
        use_impedances: false
      gripper_right:
        name: JointController
        motor_type: position
        command_input_limits: null
        use_delta_commands: false
        use_impedances: false

objects: []

task:
  type: DummyTask
