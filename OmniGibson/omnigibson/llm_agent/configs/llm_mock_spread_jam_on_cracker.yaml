# Mock LLM: oracle (GT) action sequence for spread_jam_on_cracker
#
# All objects are on the same countertop.
# → One NAVIGATE_TO at the start is sufficient.
#
# Oracle sequence:
#   1. NAVIGATE_TO countertop
#   2. GRASP cracker → PLACE_ON_TOP rubber_mat (non-slip surface)
#   3. GRASP knife → SPREAD jam on cracker (repeat until covered)
#   4. DONE
#
# Usage:
#   python -m omnigibson.examples.llm_agent.run_llm_agent \
#     --model mock --task spread_jam_on_cracker \
#     --scene house_single_floor --robot Fetch --symbolic

type: mock
responses:
  # Step 1: Navigate to the countertop (all objects are here)
  - "Thought: All objects are on the countertop. I need to navigate there first.\nAction: NAVIGATE_TO[countertop.n.01_1]"

  # Step 2: Pick up cracker
  - "Thought: I need to place the cracker on the rubber mat first to prevent sliding during spreading.\nAction: GRASP[half__pretzel.n.01_1]"

  # Step 3: Place cracker on rubber_mat
  - "Thought: Place the cracker on the rubber mat for a non-slip surface.\nAction: PLACE_ON_TOP[rubber_mat.n.01_1]"

  # Step 4: Grasp the knife
  - "Thought: Now grasp the table knife as a spreading tool.\nAction: GRASP[table_knife.n.01_1]"

  # Step 5-10: Spread jam (repeat to ensure covered condition is met)
  - "Thought: Spread jam on the cracker.\nAction: SPREAD[jam.n.01_1, half__pretzel.n.01_1]"
  - "Thought: Spread more jam to ensure full coverage.\nAction: SPREAD[jam.n.01_1, half__pretzel.n.01_1]"
  - "Thought: Continue spreading jam.\nAction: SPREAD[jam.n.01_1, half__pretzel.n.01_1]"
  - "Thought: Keep spreading jam.\nAction: SPREAD[jam.n.01_1, half__pretzel.n.01_1]"
  - "Thought: Spread a bit more jam.\nAction: SPREAD[jam.n.01_1, half__pretzel.n.01_1]"
  - "Thought: One more application of jam.\nAction: SPREAD[jam.n.01_1, half__pretzel.n.01_1]"

  # Step 11: Done
  - "Thought: The cracker is now fully covered with jam. Task complete.\nAction: DONE[]"
