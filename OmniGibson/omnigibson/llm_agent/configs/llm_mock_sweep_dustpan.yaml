# Mock LLM: ground-truth action sequence for sweep_dustpan (Method 2 — stair step)
#
# Correct sequence:
#   1. Navigate to floor (dustpan is on floor) → GRASP dustpan
#   2. Navigate to stair_first_step → PLACE_ON_TOP stair_first_step
#   3. Navigate to floor (broom is on floor) → GRASP broom
#   4. SWEEP floor_landing  (gather crumbs from floor to landing)
#   5. Navigate to floor_landing → SWEEP dustpan  (sweep crumbs off edge into dustpan)
#   6. DONE
#
type: mock
responses:
  # Step 1: Navigate to floor where the dustpan is
  - "Thought: I need to place the dustpan on the first stair step. The dustpan is on the floor, so I'll navigate there first.\nAction: NAVIGATE_TO[floor.n.01_1]"

  # Step 2: Pick up the dustpan
  - "Thought: I'm near the floor area. I'll pick up the dustpan.\nAction: GRASP[dustpan.n.02_1]"

  # Step 3: Navigate to the stair first step
  - "Thought: I need to go to the stair first step to place the dustpan there.\nAction: NAVIGATE_TO[stair_first_step.n.01_1]"

  # Step 4: Place dustpan on the first stair step
  - "Thought: I'll place the dustpan on the first step of the descending staircase. When I sweep crumbs off the landing edge, they'll fall down into the dustpan by gravity.\nAction: PLACE_ON_TOP[stair_first_step.n.01_1]"

  # Step 5: Navigate to floor where the broom is
  - "Thought: Now I need the broom. It's on the floor, so I'll navigate there.\nAction: NAVIGATE_TO[floor.n.01_1]"

  # Step 6: Pick up the broom
  - "Thought: I'm near the broom. I'll pick it up.\nAction: GRASP[broom.n.01_1]"

  # Step 7: Sweep breadcrumbs from the floor to the floor landing (gathering step)
  - "Thought: The breadcrumbs are scattered across the floor. I need to gather them to the floor landing area right at the top of the stairs.\nAction: SWEEP[floor_landing.n.01_1]"

  # Step 8: Navigate to the floor landing (need to be at the edge to sweep into dustpan below)
  - "Thought: I need to go to the floor landing to sweep the gathered crumbs off the edge into the dustpan on the step below.\nAction: NAVIGATE_TO[floor_landing.n.01_1]"

  # Step 9: Sweep gathered breadcrumbs from landing into the dustpan
  - "Thought: The breadcrumbs are gathered at the landing. I'll sweep them off the edge so they fall into the dustpan on the stair step below.\nAction: SWEEP[dustpan.n.02_1]"

  # Step 10: Done
  - "Thought: The breadcrumbs have been swept into the dustpan and the floor is clean. Task complete.\nAction: DONE[]"
