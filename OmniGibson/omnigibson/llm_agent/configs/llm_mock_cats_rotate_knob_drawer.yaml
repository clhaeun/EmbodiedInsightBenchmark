  # --- Probe 1 ---
  - |
    Key findings:
    1. PULL[knob]: 0mm displacement, LOCKED
    2. TWIST[knob, clockwise]: 0 degrees — knob is BLOCKED against rotation
    3. TOUCH[knob_center]: center region D=7.8mm, recessed 0.5mm, compliance 0.10 mm/N
