responses:
  # --- Probe 0: Demo text comprehension ---
  - |
    Demo 1 (Bedside table): Person grabs a round metal knob and pulls. Drawer slides open smoothly. Principle: simple pull on a round knob opens the drawer.
    Demo 2 (Gas stove): Person pushes a burner knob inward against the panel, holds it in, and turns it to the left. A clicking sound is heard and the burner ignites. Principle: push-in enables rotation.
    Demo 3 (Kitchen cabinet): Person pushes a flat panel inward, it clicks and pops back, then they pull it open. Spring-loaded push-to-open mechanism.
    Demo 4 (Desk drawer): Person grips a round knob, turns it clockwise about a quarter turn, hears a click, then pulls the drawer open. Simple rotation-then-pull.

