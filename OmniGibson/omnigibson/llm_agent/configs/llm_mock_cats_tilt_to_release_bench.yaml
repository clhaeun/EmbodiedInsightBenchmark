  # --- Probe 3: Adaptation reflection ---
  - |
    I applied the see-saw principle from Demo 2: pressing one end down causes the opposite end to rise. The key was recognizing that both center and rear presses produced vibrations, but ONLY the rear press produced front displacement (+0.5mm) and a strong click — this asymmetry was the critical clue.

    - Rear force: 12N, matching the exploration force that triggered the front click.
    - Hold while lift: Critical — the second click on release confirmed the mechanism resets, so rear pressure must be maintained.
    - Front lift force: 8N, moderate.
    - The decorative latch initially suggested Demo 1 (flip and lift), but was immediately ruled out. Demo 4 (lift straight up) was also ruled out since the rear brackets constrain the lid to rotation only.
