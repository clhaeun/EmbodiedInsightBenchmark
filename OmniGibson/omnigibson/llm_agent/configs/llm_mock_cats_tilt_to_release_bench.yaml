  # --- Probe 1: Context feature reflection ---
  - |
    Key findings:
    1. Decorative latch: fixed, welded, no mechanical function (PUSH → 0mm displacement)
    2. Front lift blocked: internal catch at front edge prevents direct opening
    3. Front edge pin: small cylindrical metal protrusion (5mm diameter, 8mm length) pointing downward, slight vertical play
    4. Rear press: rear -3.2mm, front +0.5mm, metallic click (1180 Hz). Returns to flat on release with second click (1210 Hz).
    5. Center press: 0.4mm flex, weak vibration (980 Hz), but NO front displacement — different from rear press
    6. Rear hinge: functional, low rotational resistance

    The rear press produces a small but detectable front rise + click, while the center press does not. This asymmetry suggests the rear press creates a pivot effect (like Demo 2's see-saw), causing the front to rise enough to release the hidden catch. But pressing alone doesn't open — the mechanism resets on release.

  # --- Analysis & Tool Selection (unified) ---
  - |
    === Situation Analysis ===
    The decorative latch is non-functional (welded). The actual lock involves a downward-pointing pin on the front edge underside.

    Pressing the rear edge causes a small front rise (+0.5mm) and a click — the pin likely clears its catch momentarily. Releasing the rear causes a second click (pin drops back). Center press produces a weak vibration but NO front rise — only rear press has the pivot effect.

    === Demo Comparison ===
    Demo 2 (see-saw) matches the structural principle: force on one end → opposite end rises. The see-saw is in a completely different domain (playground), but the physics are identical — pivot around a fulcrum.

    Demo 1 (toolbox clasp) is the visual trap — the latch is decorative.

    === Execution Plan ===
    Press rear edge with ~12N (matching the force that produced the click), hold pressure, then lift front with ~8N. Must hold rear press — if released, the pin drops back (second click).

    SELECTED_TOOL: technique_B

  # --- Stage 3: Execution ---
  - |
